name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Dependency-direction check (packages/recorder stays framework-free)
        run: pnpm run dep-check

      - name: Unit tests
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: recordmint
          POSTGRES_PASSWORD: recordmint
          POSTGRES_DB: recordmint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recordmint -d recordmint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start SeaweedFS
        # GitHub Actions' `services:` block can only pass docker-run flags
        # (`image`/`env`/`ports`/`options`) and no container command, so the
        # store is started directly with `docker run -d` on `--network host`,
        # matching how `infra/compose.yaml`'s `seaweedfs` service passes the
        # same arguments to `weed server`.
        run: |
          docker run -d --name seaweedfs --network host \
            -v "$PWD/infra/seaweedfs/s3-identity.json:/etc/recordmint/s3-identity.json:ro" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -filer -s3 -s3.port=8333 \
            -s3.config=/etc/recordmint/s3-identity.json -master.telemetry=false

          # The master opens its port before the volume server has registered
          # with it, so the loop waits on the filer: that is what the S3
          # gateway is backed by, and it is the last piece that has to be up
          # before an S3 request can be served.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/ > /dev/null; then
              echo "SeaweedFS is ready."
              exit 0
            fi
            echo "Waiting for SeaweedFS to become ready ($i/30)..."
            sleep 2
          done
          echo "SeaweedFS did not become ready in time." >&2
          docker logs seaweedfs || true
          exit 1

      - name: Initialize bucket and CORS
        # Plain S3 API (CreateBucket, PutBucketCors) through the AWS SDK this
        # repository already depends on, so the same script runs against any
        # S3-compatible store. It also retries while the store is settling.
        run: node infra/seaweedfs/bootstrap-bucket.mjs
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: us-east-1
          S3_BUCKET: recordmint
          S3_ACCESS_KEY_ID: recordmintdev
          S3_SECRET_ACCESS_KEY: recordmint-dev-secret
          S3_FORCE_PATH_STYLE: "true"

      - name: Run database migrations
        run: pnpm --filter @recordmint/db run db:migrate
        env:
          DATABASE_URL: postgres://recordmint:recordmint@localhost:5432/recordmint

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: postgres://recordmint:recordmint@localhost:5432/recordmint
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: us-east-1
          S3_BUCKET: recordmint
          S3_ACCESS_KEY_ID: recordmintdev
          S3_SECRET_ACCESS_KEY: recordmint-dev-secret
          S3_FORCE_PATH_STYLE: "true"
          PUBLIC_BASE_URL: http://localhost:3000
          SESSION_SECRET: local-development-only-secret-do-not-use-in-production
          PORT: "3000"

      - name: Run real-service release checklist checks
        run: |
          pnpm --filter @recordmint/db exec vitest run src/__tests__/migrations.live.test.ts
          pnpm --filter @recordmint/storage exec vitest run src/__tests__/live.test.ts
          pnpm --filter @recordmint/web exec vitest run src/app/api/health/__tests__/route.live.test.ts src/features/recording/application/__tests__/manage.live.test.ts
        env:
          DATABASE_URL: postgres://recordmint:recordmint@localhost:5432/recordmint
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: us-east-1
          S3_BUCKET: recordmint
          S3_ACCESS_KEY_ID: recordmintdev
          S3_SECRET_ACCESS_KEY: recordmint-dev-secret
          S3_FORCE_PATH_STYLE: "true"
          TRANSCRIPTION_ENABLED: "false"

      - name: Run Playwright (fake capture device)
        run: pnpm run e2e
        env:
          DATABASE_URL: postgres://recordmint:recordmint@localhost:5432/recordmint
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: us-east-1
          S3_BUCKET: recordmint
          S3_ACCESS_KEY_ID: recordmintdev
          S3_SECRET_ACCESS_KEY: recordmint-dev-secret
          S3_FORCE_PATH_STYLE: "true"
          PUBLIC_BASE_URL: http://localhost:3000
          SESSION_SECRET: local-development-only-secret-do-not-use-in-production
          PORT: "3000"
