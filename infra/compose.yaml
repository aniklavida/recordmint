# Four processes, two stores — web, worker, Postgres, MinIO. No Redis, no
# broker, no transcoding tier: the job queue rides on the Postgres that is
# already here, and the browser records a file that already plays everywhere,
# so a self-hoster runs, backs up and restores two services instead of five.
# Every credential below is a throwaway local-development default, not a
# production secret: a real deployment fills .env.example instead of
# reusing these values.
#
# Every image below is pinned to an exact tag and digest, verified in
# docs/THIRD_PARTY_LICENSES.md. Postgres and MinIO are separate-process
# dependencies (AGPL-3.0 for MinIO is fine here — see AGENTS.md's two-class
# rule); pinning is about reproducibility and availability, not licence.
# MinIO discontinued free Docker Hub distribution during 2025 — `minio/minio`
# and `minio/mc` are gone from Docker Hub entirely, so both now pull from
# their quay.io mirror instead.
name: recordmint

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: recordmint
      POSTGRES_PASSWORD: recordmint
      POSTGRES_DB: recordmint
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordmint -d recordmint"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BUCKET: recordmint
    entrypoint: ["/bin/sh", "/bootstrap/create-bucket.sh"]
    volumes:
      - ./minio/create-bucket.sh:/bootstrap/create-bucket.sh:ro
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://recordmint:recordmint@postgres:5432/recordmint
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: recordmint
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_BASE_URL: http://localhost:3000
      SESSION_SECRET: local-development-only-secret-do-not-use-in-production
      PORT: "3000"
      TRANSCRIPTION_ENABLED: "false"
    ports:
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://recordmint:recordmint@postgres:5432/recordmint
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: recordmint
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      TRANSCRIPTION_ENABLED: "false"
      WHISPER_MODEL: base

volumes:
  pgdata:
  minio-data:
