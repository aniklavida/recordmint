# Four processes, two stores — web, worker, Postgres, SeaweedFS. No Redis, no
# broker, no transcoding tier: the job queue rides on the Postgres that is
# already here, and the browser records a file that already plays everywhere,
# so a self-hoster runs, backs up and restores two services instead of five.
# Every credential below is a throwaway local-development default, not a
# production secret: a real deployment fills .env.example instead of
# reusing these values.
#
# Every image below is pinned to an exact tag and digest, verified in
# docs/THIRD_PARTY_LICENSES.md. Postgres and SeaweedFS are separate-process
# dependencies (AGENTS.md's two-class rule); SeaweedFS is Apache-2.0, so it
# clears even the stricter "compiled into shipped code" bar, and it runs as
# its own process here regardless. Pinning is about reproducibility and
# availability, not licence.
#
# SeaweedFS speaks the S3 API, so nothing in packages/storage knows what is
# behind S3_ENDPOINT. The access key and secret below come from
# seaweedfs/s3-identity.json, which grants them to a named identity and
# defines no anonymous one — that is what keeps the bucket private.
name: recordmint

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: recordmint
      POSTGRES_PASSWORD: recordmint
      POSTGRES_DB: recordmint
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordmint -d recordmint"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One process runs the whole store: master, volume server, filer and the S3
  # gateway, each in its own goroutine, which is what keeps this stack at four
  # processes rather than seven. Only the S3 port is published — the master,
  # volume and filer ports are internal, and a self-hoster's browser only ever
  # talks S3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/recordmint/s3-identity.json
      # No usage statistics leave a self-hoster's machine.
      - -master.telemetry=false
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3-identity.json:/etc/recordmint/s3-identity.json:ro
    ports:
      - "8333:8333"
    healthcheck:
      # `curl` is installed in this image. The filer is what the S3 gateway is
      # backed by, so a 200 here means an S3 request can actually be served.
      # The S3 port itself answers an unsigned request with 403 by design — the
      # bucket is private — which `curl -f` would read as a failure.
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the bucket and applies its CORS policy through the plain S3 API
  # (CreateBucket, PutBucketCors), so it works against any S3-compatible store
  # and not just this one. Idempotent, and it retries while the store is still
  # coming up. It reuses the repository's own built image so it carries the
  # same AWS SDK packages/storage already depends on — no second Node image,
  # no vendor-specific client binary.
  s3-init:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-recordmint}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-recordmintdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-recordmint-dev-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-*}
    entrypoint: ["node", "/app/infra/seaweedfs/bootstrap-bucket.mjs"]
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://recordmint:recordmint@postgres:5432/recordmint}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-recordmint}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-recordmintdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-recordmint-dev-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-secret-do-not-use-in-production}
      PORT: ${PORT:-3000}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
    ports:
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://recordmint:recordmint@postgres:5432/recordmint}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-recordmint}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-recordmintdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-recordmint-dev-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-}

volumes:
  pgdata:
  seaweedfs-data:
